name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and build in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          envs: VER
          prepare: pkg install -y hs-ShellCheck node php85 php85-extensions php85-mbstring php85-pcntl libxml2
          run: |
            set -e
            sh tests/run.sh
            sh build.sh "$VER" 15
            sh build.sh "$VER" 16
            cd dist
            # Version-less copies give stable releases/latest/download/ URLs.
            for m in 15 16; do
              cp "pfSense-pkg-gamedetect-$VER-fbsd$m.pkg" "pfSense-pkg-gamedetect-fbsd$m.pkg"
            done
            for p in *.pkg; do sha256 -r "$p"; done > SHA256SUMS
        env:
          VER: ${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: pfSense-pkg-gamedetect
          path: |
            dist/*.pkg
            dist/SHA256SUMS
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pkg
            dist/SHA256SUMS
