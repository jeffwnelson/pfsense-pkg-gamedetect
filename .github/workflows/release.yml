#
# One workflow for checks, tests and releases. Pushes made with GITHUB_TOKEN
# (the bump commit and tag) do not trigger other workflows, so the release
# is built and published in the same run that bumps the version.
name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pushes to main and manual runs share one queue and are never cancelled
  # mid-release; each pull request gets its own group.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate conventional commits since the last tag
        uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: --from-latest-tag

  test:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute dev version
        id: ver
        # 0.0.0.g<sha7> sorts below every release and is not x.y.z, so the
        # self-updater never mistakes a dev build for a release.
        run: echo "version=0.0.0.g$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test and build in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          envs: VER
          prepare: pkg install -y hs-ShellCheck node php85 php85-extensions php85-mbstring php85-pcntl libxml2
          run: |
            set -e
            sh tests/run.sh
            sh build.sh "$VER" 15
            sh build.sh "$VER" 16
            cd dist
            for m in 15 16; do
              cp "pfSense-pkg-gamedetect-$VER-fbsd$m.pkg" "pfSense-pkg-gamedetect-fbsd$m.pkg"
            done
            for p in *.pkg; do sha256 -r "$p"; done > SHA256SUMS
        env:
          VER: ${{ steps.ver.outputs.version }}
      - name: Upload dev packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pfSense-pkg-gamedetect-${{ steps.ver.outputs.version }}
          path: |
            dist/*.pkg
            dist/SHA256SUMS

  version:
    needs: [check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install cocogitto
        run: |
          set -e
          COG_VERSION=6.4.0
          curl -sfL "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cog.tgz
          tar -xzf /tmp/cog.tgz -C /tmp
          sudo mv /tmp/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
          cog --version
      - name: Configure git for cog-bot
        run: |
          git config user.name 'cog-bot'
          git config user.email 'cog-bot@users.noreply.github.com'
      - name: Bump version, write CHANGELOG, push main and tag
        id: bump
        run: |
          set -e
          BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          # Foreground, so cog's stderr reaches the log on failure.
          if ! cog bump --auto; then
            echo "::error::cog bump --auto failed; see the output above" >&2
            exit 1
          fi
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "No version bump (no feat, fix or breaking commit since $BEFORE)"
          else
            echo "Bumped: ${BEFORE:-none} -> $AFTER"
            echo "version=${AFTER#v}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - name: Build in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          envs: VER
          prepare: pkg install -y php85 php85-extensions
          run: |
            set -e
            sh build.sh "$VER" 15
            sh build.sh "$VER" 16
            cd dist
            # Version-less copies give stable releases/latest/download/ URLs.
            for m in 15 16; do
              cp "pfSense-pkg-gamedetect-$VER-fbsd$m.pkg" "pfSense-pkg-gamedetect-fbsd$m.pkg"
            done
            for p in *.pkg; do sha256 -r "$p"; done > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          set -e
          awk -v h="## [v$VER]" 'index($0, h) == 1 { p = 1; next } p && /^- - -$/ { exit } p' \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG.md section for v$VER" >&2
            exit 1
          fi
          cat release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*.pkg
            dist/SHA256SUMS
          fail_on_unmatched_files: true
